<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ася и Маша</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fad0c4, #a1c4fd);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* Анимированный фон */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Дополнительные анимированные элементы фона */
        .bg-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .element {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            animation: float 15s infinite linear;
        }
        
        .element:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
            background: rgba(255, 154, 158, 0.3);
        }
        
        .element:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 70%;
            left: 80%;
            animation-delay: 2s;
            background: rgba(161, 196, 253, 0.3);
        }
        
        .element:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 20%;
            left: 85%;
            animation-delay: 4s;
            background: rgba(250, 208, 196, 0.4);
        }
        
        .element:nth-child(4) {
            width: 100px;
            height: 100px;
            top: 80%;
            left: 15%;
            animation-delay: 6s;
            background: rgba(255, 255, 255, 0.25);
        }
        
        .element:nth-child(5) {
            width: 70px;
            height: 70px;
            top: 40%;
            left: 5%;
            animation-delay: 8s;
            background: rgba(255, 154, 158, 0.4);
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.7;
            }
            25% {
                transform: translateY(-20px) rotate(90deg);
            }
            50% {
                transform: translateY(0) rotate(180deg);
                opacity: 1;
            }
            75% {
                transform: translateY(20px) rotate(270deg);
            }
            100% {
                transform: translateY(0) rotate(360deg);
                opacity: 0.7;
            }
        }
        
        /* Основной текст */
        .main-text {
            text-align: center;
            padding: 20px;
            z-index: 1;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            max-width: 90%;
        }
        
        .main-text h1 {
            font-size: 5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
            animation: textGlow 3s ease-in-out infinite alternate;
        }
        
        .main-text h2 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        @keyframes textGlow {
            0% {
                filter: drop-shadow(0 0 5px rgba(255, 119, 140, 0.7));
            }
            100% {
                filter: drop-shadow(0 0 20px rgba(255, 126, 179, 0.9));
            }
        }
        
        /* Строка с комплиментами */
        .compliments-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            padding: 20px 0;
            overflow: hidden;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .compliments-track {
            display: flex;
            white-space: nowrap;
            animation: scrollText 40s linear infinite;
        }
        
        .compliment {
            display: inline-flex;
            align-items: center;
            padding: 0 30px;
            font-size: 1.8rem;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        .compliment i {
            margin-right: 10px;
            color: #ff7eb3;
        }
        
        @keyframes scrollText {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }
        
        /* Сердечки */
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .heart {
            position: absolute;
            font-size: 1.5rem;
            color: rgba(255, 126, 179, 0.7);
            opacity: 0;
            animation: fall 10s linear infinite;
        }
        
        @keyframes fall {
            0% {
                top: -10%;
                opacity: 0;
                transform: translateX(0) rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                top: 110%;
                opacity: 0;
                transform: translateX(100px) rotate(360deg);
            }
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .main-text h1 {
                font-size: 3.5rem;
            }
            
            .main-text h2 {
                font-size: 1.8rem;
            }
            
            .compliment {
                font-size: 1.4rem;
                padding: 0 20px;
            }
        }
        
        @media (max-width: 480px) {
            .main-text h1 {
                font-size: 2.5rem;
            }
            
            .main-text h2 {
                font-size: 1.5rem;
            }
            
            .compliment {
                font-size: 1.2rem;
                padding: 0 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Анимированные элементы фона -->
    <div class="bg-elements">
        <div class="element"></div>
        <div class="element"></div>
        <div class="element"></div>
        <div class="element"></div>
        <div class="element"></div>
    </div>
    
    <!-- Плавающие сердечки -->
    <div class="hearts" id="heartsContainer"></div>
    
    <!-- Основной текст -->
    <div class="main-text">
        <h1>Ася и Маша</h1>
        <h2>Две замечательные девушки</h2>
    </div>
    
    <!-- Строка с комплиментами -->
    <div class="compliments-container">
        <div class="compliments-track">
            <!-- Комплименты будут добавляться через JavaScript -->
        </div>
    </div>

    <script>
        // Создаем плавающие сердечки
        function createHearts() {
            const heartsContainer = document.getElementById('heartsContainer');
            const heartCount = 25;
            
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '<i class="fas fa-heart"></i>';
                
                // Случайная позиция и задержка
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDelay = Math.random() * 10 + 's';
                heart.style.fontSize = (Math.random() * 1 + 1) + 'rem';
                
                heartsContainer.appendChild(heart);
            }
        }
        
        // Список комплиментов
        const compliments = [
            { icon: 'fas fa-heart', text: 'Красивая' },
            { icon: 'fas fa-star', text: 'Яркая' },
            { icon: 'fas fa-sun', text: 'Солнечная' },
            { icon: 'fas fa-gem', text: 'Бриллиантовая' },
            { icon: 'fas fa-smile', text: 'Улыбчивая' },
            { icon: 'fas fa-feather-alt', text: 'Нежная' },
            { icon: 'fas fa-magic', text: 'Волшебная' },
            { icon: 'fas fa-crown', text: 'Великолепная' },
            { icon: 'fas fa-moon', text: 'Загадочная' },
            { icon: 'fas fa-cloud', text: 'Воздушная' },
            { icon: 'fas fa-music', text: 'Мелодичная' },
            { icon: 'fas fa-palette', text: 'Креативная' },
            { icon: 'fas fa-bolt', text: 'Энергичная' },
            { icon: 'fas fa-glasses', text: 'Умная' },
            { icon: 'fas fa-laugh', text: 'Веселая' },
            { icon: 'fas fa-hand-sparkles', text: 'Очаровательная' },
            { icon: 'fas fa-flower', text: 'Цветущая' },
            { icon: 'fas fa-butterfly', text: 'Грациозная' },
            { icon: 'fas fa-rainbow', text: 'Разнообразная' },
            { icon: 'fas fa-sparkles', text: 'Сияющая' }
        ];
        
        // Добавляем комплименты в бегущую строку
        function addCompliments() {
            const track = document.querySelector('.compliments-track');
            
            // Добавляем комплименты дважды для плавной бесконечной анимации
            for (let i = 0; i < 2; i++) {
                compliments.forEach(compliment => {
                    const complimentEl = document.createElement('div');
                    complimentEl.classList.add('compliment');
                    complimentEl.innerHTML = `<i class="${compliment.icon}"></i><span>${compliment.text}</span>`;
                    track.appendChild(complimentEl);
                });
            }
        }
        
        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            createHearts();
            addCompliments();
            
            // Добавляем эффект при наведении на основной текст
            const mainText = document.querySelector('.main-text h1');
            mainText.addEventListener('mouseenter', function() {
                this.style.transform = 'scale(1.05)';
                this.style.transition = 'transform 0.3s ease';
            });
            
            mainText.addEventListener('mouseleave', function() {
                this.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
